name: Build Android app

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/build-android.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      # Signing key from repo Settings → Secrets and variables → Actions.
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
            echo "Release key found: this build is ready for Play Store."
          else
            echo "::warning::KEYSTORE_BASE64 secret is missing. Signed with a debug key: test only, NOT for Play Store."
          fi

      - name: Build APK (to install) and AAB (for Play Store)
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle --no-daemon assembleRelease bundleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: ambu-escape-apk-${{ github.run_number }}
          path: android/app/build/outputs/apk/release/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ambu-escape-playstore-aab-${{ github.run_number }}
          path: android/app/build/outputs/bundle/release/*.aab
