name: Build Android app

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/build-android.yml']
  workflow_dispatch:

permissions:
  contents: write   # to publish the build to the build-output branch

jobs:
  build:
    runs-on: ubuntu-24.04   # has the Android SDK preinstalled
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      # Signing key from repo Settings → Secrets and variables → Actions.
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
            echo "SIGNING=release" >> "$GITHUB_ENV"
            echo "Release key found: this build is ready for Play Store."
          else
            echo "SIGNING=debug-TEST-ONLY" >> "$GITHUB_ENV"
            echo "::warning::KEYSTORE_BASE64 secret is missing. Signed with a debug key: test only, NOT for Play Store."
          fi

      - name: Build APK (to install) and AAB (for Play Store)
        working-directory: android
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -o pipefail
          gradle --no-daemon assembleRelease bundleRelease 2>&1 | tee ../build.log

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ambu-escape-apk-${{ github.run_number }}
          path: android/app/build/outputs/apk/release/*.apk

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ambu-escape-playstore-aab-${{ github.run_number }}
          path: android/app/build/outputs/bundle/release/*.aab

      # Latest build (or its error log) on branch "build-output", easy to download from a phone.
      - name: Publish to build-output branch
        if: always()
        shell: bash
        run: |
          mkdir -p /tmp/out
          cp build.log /tmp/out/ 2>/dev/null || echo "no log" > /tmp/out/build.log
          tail -c 60000 /tmp/out/build.log > /tmp/out/build-tail.log
          rm /tmp/out/build.log
          cp android/app/build/outputs/apk/release/*.apk "/tmp/out/AmbuEscape-${{ github.run_number }}.apk" 2>/dev/null || true
          cp android/app/build/outputs/bundle/release/*.aab "/tmp/out/AmbuEscape-${{ github.run_number }}-playstore.aab" 2>/dev/null || true
          echo "run=${{ github.run_number }} commit=${{ github.sha }} signing=${SIGNING} result=${{ job.status }}" > /tmp/out/BUILD-INFO.txt
          cd /tmp/out
          git init -q -b build-output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "Build ${{ github.run_number }} (${{ job.status }})"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" build-output
